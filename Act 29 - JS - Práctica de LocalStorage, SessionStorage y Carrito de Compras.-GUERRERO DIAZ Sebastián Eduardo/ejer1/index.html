<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preferencias de Usuario</title>
    <link rel="stylesheet" href="estilo.css">
    <script src="src/ejer1.js" defer></script>
</head>

<body>

    <div class="contenedor">
        <h1>Preferencias de Usuario</h1>

        <label for="nombre">Nombre:</label>
        <input type="text" id="nombre">

        <label for="color">Color de fondo:</label>
        <select id="color">
            <option value="white">Blanco</option>
            <option value="lightblue">Celeste</option>
            <option value="lightgreen">Verde</option>
            <option value="lightyellow">Amarillo</option>
        </select>

        <button id="guardar">Guardar preferencias</button>

        <p id="mensaje"></p>
    </div>

</body>
</html>
