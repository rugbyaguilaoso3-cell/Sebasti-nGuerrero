<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 6</title>
    <script src="src/ejer6.js" defer></script>
</head>
<body>

    <form>

        <p>1. ¿Cuál es la capital de Argentina?</p>

        <select id="pregunta1">
            <option value="incorrecta">Córdoba</option>
            <option value="correcta">Buenos Aires</option>
            <option value="incorrecta">Rosario</option>
        </select>


        <p>2. ¿Cuánto es 2 + 2?</p>

        <select id="pregunta2">
            <option value="incorrecta">3</option>
            <option value="correcta">4</option>
            <option value="incorrecta">5</option>
        </select>


        <p>3. ¿Cuál es un lenguaje de programación?</p>

        <select id="pregunta3">
            <option value="correcta">JavaScript</option>
            <option value="incorrecta">HTML</option>
            <option value="incorrecta">CSS</option>
        </select>


        <p>4. ¿Cuánto es 10 - 5?</p>

        <select id="pregunta4">
            <option value="incorrecta">3</option>
            <option value="correcta">5</option>
            <option value="incorrecta">8</option>
        </select>


        <br><br>

        <button type="button" id="corregir">Corregir</button>

        <p id="resultado"></p>

    </form>

</body>
</html>
